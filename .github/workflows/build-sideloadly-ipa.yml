name: Build Unsigned IPA for Sideloadly

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode and install XcodeGen
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la OfflineIndicVoiceAI.xcodeproj

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project OfflineIndicVoiceAI.xcodeproj \
            -scheme OfflineIndicVoiceAI

      - name: Build unsigned iOS ARM64 app
        run: |
          xcodebuild \
            -project OfflineIndicVoiceAI.xcodeproj \
            -scheme OfflineIndicVoiceAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into unsigned IPA for Sideloadly
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/VaaniLocal.app"
          test -d "$APP_PATH"
          plutil -p "$APP_PATH/Info.plist"
          plutil -p "$APP_PATH/Info.plist" | grep -q "NSMicrophoneUsageDescription"
          plutil -p "$APP_PATH/Info.plist" | grep -q "UIFileSharingEnabled"
          rm -rf Payload VaaniLocal-Sideloadly.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry VaaniLocal-Sideloadly.ipa Payload
          rm -rf Payload
          ls -lh VaaniLocal-Sideloadly.ipa

      - name: Upload Sideloadly IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaaniLocal-Sideloadly-IPA
          path: VaaniLocal-Sideloadly.ipa
          retention-days: 30
