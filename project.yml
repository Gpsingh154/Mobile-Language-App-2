name: OfflineIndicVoiceAI
options:
  bundleIdPrefix: com.offlineindic
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM
    branch: main
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    branch: master

targets:
  OfflineIndicVoiceAI:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: OfflineIndicVoiceAI
        excludes:
          - "Resources/Info.plist"
          - "Resources/OfflineIndicVoiceAI.entitlements"
          - "Resources/OfflineIndicVoiceAI-PaidDev.entitlements"
    resources:
      - path: OfflineIndicVoiceAI/Resources/Assets.xcassets
    info:
      path: OfflineIndicVoiceAI/Resources/Info.plist
    entitlements:
      path: OfflineIndicVoiceAI/Resources/OfflineIndicVoiceAI.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.offlineindic.voiceai
        PRODUCT_NAME: VaaniLocal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: targeted
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
      - package: SherpaOnnx
        product: sherpa-onnx
      - sdk: AVFoundation.framework
      - sdk: Accelerate.framework
